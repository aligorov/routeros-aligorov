        - heading "sendSms" [level=1] [ref=f4e178]
        - generic [ref=f4e179]:
          - paragraph [ref=f4e180]: Отправляет одно СМС сообщение.
          - heading "Запрос" [level=2] [ref=f4e182]
          - generic [ref=f4e183]: GET https://api.bytehand.com/v1/send
          - heading "Параметры" [level=3] [ref=f4e185]
          - table [ref=f4e186]:
            - rowgroup [ref=f4e187]:
              - row [ref=f4e188]:
                - columnheader "Параметры запроса" [ref=f4e189]
                - columnheader [ref=f4e190]
            - rowgroup [ref=f4e191]:
              - row [ref=f4e192]:
                - cell "from" [ref=f4e193]
                - cell [ref=f4e194]:
                  - paragraph [ref=f4e195]: string
                  - paragraph [ref=f4e196]: Обязательный параметр. Подпись отправителя СМС, отображаемая в телефоне получателя. Необходимо предварительно зарегистрировать в личном кабинете и пройти модерацию менеджерами BYTEHAND. Динамическая подпись отправителя включается по специальному запросу.
              - row [ref=f4e197]:
                - cell "id" [ref=f4e198]
                - cell [ref=f4e199]:
                  - paragraph [ref=f4e200]: number
                  - paragraph [ref=f4e201]: Обязательный параметр. Идентификатор пользователя.
              - row [ref=f4e202]:
                - cell "key" [ref=f4e203]
                - cell "string Обязательный параметр. Уникальный ключ пользователя. Cтрока из 16 символов, пример AB48D920104CE241." [ref=f4e204]:
                  - paragraph [ref=f4e205]: string
                  - paragraph [ref=f4e206]:
                    - text: Обязательный параметр.
                    - generic [ref=f4e207]: Уникальный ключ пользователя. Cтрока из 16 символов, пример AB48D920104CE241.
              - row [ref=f4e208]:
                - cell "send_after" [ref=f4e209]
                - cell [ref=f4e210]:
                  - paragraph [ref=f4e211]: string
                  - paragraph [ref=f4e212]: Необязательный параметр. Дата и время, когда требуется отправить сообщение. По умолчанию сообщение отправляется немедленно.
              - row [ref=f4e213]:
                - cell "text" [ref=f4e214]
                - cell [ref=f4e215]:
                  - paragraph [ref=f4e216]: string
                  - paragraph [ref=f4e217]: Обязательный параметр. Текст отправляемого сообщения. Максимальный размер не более 800 символов, некоторые операторы связи могут вводить дополнительные ограничения. Сообщение при необходимости будет разбито на несколько СМС, отправленных абоненту и оплаченных по отдельности. Размер одного СМС – 160 символов в латинице или 70 символов в кириллице. При разбивке сообщения на несколько СМС в каждую часть добавляется заголовок для объединения частей в одно сообщение на телефоне получателя, и максимальная длина становится 67 для кириллицы и 153 для латинских букв.
              - row [ref=f4e218]:
                - cell "to" [ref=f4e219]
                - cell [ref=f4e220]:
                  - paragraph [ref=f4e221]: string
                  - paragraph [ref=f4e222]: Обязательный параметр. Один номер телефона получателя СМС сообщения. Будет автоматически преобразован в международный формат телефонных номеров.
          - heading "Авторизация" [level=3] [ref=f4e224]
          - paragraph [ref=f4e225]: Не требует авторизации и наличия каких-то определённых прав доступа.
          - heading "Ответ" [level=2] [ref=f4e227]
          - paragraph [ref=f4e228]: Поле description содержит идентификатор отправленного СМС сообщения.
          - heading "Пример" [level=2] [ref=f4e230]
          - paragraph [ref=f4e231]: Запрос
          - generic [ref=f4e232]: GET https://api.bytehand.com/v1/send?send_after=2017-01-17%2010%3A00%3A00&from=MyShop&id=71234&to=%2B79167654321&text=Today%20only!%2020%25%20off%20for%20all%20goods!!&key=AB48D920104CE241
          - paragraph [ref=f4e233]: Ответ
          - generic [ref=f4e234]: "Status Code: 200 Content-Type: application/json;charset=UTF-8 Cache-Control: no-cache, no-store, max-age=0, must-revalidate Pragma: no-cache { \"status\": 0, \"description\": \"164030961834893019\" }"
