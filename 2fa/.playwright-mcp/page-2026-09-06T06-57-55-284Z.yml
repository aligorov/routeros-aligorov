                  - rowgroup [ref=f4e3543]:
                    - row [ref=f4e3544]:
                      - columnheader [ref=f4e3545]:
                        - paragraph [ref=f4e3546]: status
                      - columnheader [ref=f4e3547]:
                        - paragraph [ref=f4e3548]: Значение
                  - rowgroup [ref=f4e3549]:
                    - row [ref=f4e3550]:
                      - cell [ref=f4e3551]:
                        - paragraph [ref=f4e3552]: "0"
                      - cell [ref=f4e3553]:
                        - paragraph [ref=f4e3554]: Ожидает начала (очередь)
                    - row [ref=f4e3555]:
                      - cell [ref=f4e3556]:
                        - paragraph [ref=f4e3557]: "8"
                      - cell [ref=f4e3558]:
                        - paragraph [ref=f4e3559]: В процессе
                    - row [ref=f4e3560]:
                      - cell [ref=f4e3561]:
                        - paragraph [ref=f4e3562]: "3"
                      - cell [ref=f4e3563]:
                        - paragraph [ref=f4e3564]: Нужен OTP код
                    - row [ref=f4e3565]:
                      - cell [ref=f4e3566]:
                        - paragraph [ref=f4e3567]: "1"
                      - cell [ref=f4e3568]:
                        - paragraph [ref=f4e3569]: Пройдено (успех)
                    - row [ref=f4e3570]:
                      - cell [ref=f4e3571]:
                        - paragraph [ref=f4e3572]: "2"
                      - cell [ref=f4e3573]:
                        - paragraph [ref=f4e3574]: Не пройдено
                    - row [ref=f4e3575]:
