          - generic [ref=f4e111]: Документация API
          - generic [ref=f4e113]:
            - paragraph [ref=f4e114]: API 2.0 SMS Aero — позволяет интегрировать систему SMS-оповещений в ваш сайт или CRM-систему. Сообщайте клиентам об изменении баланса, доставке заказа, прибытии такси или других важных событиях автоматически. Все методы доступны с помощью запросов типа GET и POST.
            - generic [ref=f4e115]:
              - strong [ref=f4e116]: Внимание!
              - text: Перед отправкой все SMS проходят ручную модерацию, которая занимает до 5-10 минут. Чтобы отключить модерацию, заключите договор с SMS Aero в разделе Реквизиты и договоры.
