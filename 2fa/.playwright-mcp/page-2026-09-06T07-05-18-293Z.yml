                      - cell [ref=f2e3568]:
                        - paragraph [ref=f2e3569]: Пройдено (успех)
                    - row [ref=f2e3570]:
                      - cell [ref=f2e3571]:
                        - paragraph [ref=f2e3572]: "2"
                      - cell [ref=f2e3573]:
