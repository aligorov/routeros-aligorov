          - generic [ref=f2e111]: Документация API
          - generic [ref=f2e113]:
            - paragraph [ref=f2e114]: API 2.0 SMS Aero — позволяет интегрировать систему SMS-оповещений в ваш сайт или CRM-систему. Сообщайте клиентам об изменении баланса, доставке заказа, прибытии такси или других важных событиях автоматически. Все методы доступны с помощью запросов типа GET и POST.
            - generic [ref=f2e115]:
              - strong [ref=f2e116]: Внимание!
              - text: Перед отправкой все SMS проходят ручную модерацию, которая занимает до 5-10 минут. Чтобы отключить модерацию, заключите договор с SMS Aero в разделе Реквизиты и договоры.
