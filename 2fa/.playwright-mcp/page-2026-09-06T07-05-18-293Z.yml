                - strong
                - heading "Webhook со статусом аутентификации" [level=3] [ref=f2e3580]
                - paragraph [ref=f2e3581]: "При изменении статуса система делает POST на ваш callbackUrl с Content-Type: application/json."
                - paragraph [ref=f2e3582]: "Тело webhook:"
                - generic [ref=f2e3583]:
                  - code [ref=f2e3585]: "{ \"id\": 17, \"status\": 3, \"number\": \"79XXXXXXXXX\" }"
                  - button [ref=f2e3586] [cursor=pointer]
              - paragraph [ref=f2e3587]: "Для UI важны значения status:"
              - list [ref=f2e3588]:
                - listitem [ref=f2e3589]:
                  - paragraph [ref=f2e3590]: "3 — требуется верификация через SMS OTP: подтверждение без ввода кода (SIM-PUSH) не завершило аутентификацию, требуется OTP-код."
                - listitem [ref=f2e3591]:
                  - paragraph [ref=f2e3592]: 2 — верификация не пройдена.
                - listitem [ref=f2e3593]:
                  - paragraph [ref=f2e3594]: 1 — верификация пройдена успешно.
              - paragraph [ref=f2e3595]: Система считает webhook успешным только при ответе HTTP 200.
              - heading "Как связать webhook с клиентским приложением" [level=3] [ref=f2e3596]
              - paragraph [ref=f2e3597]: Webhook отправляется на callbackUrl, то есть на ваш server-side компонент. Он не имеет прямого канала для обновления браузера/приложения пользователя, поэтому фронтенд должен получать изменения статуса через ваш сервер.
              - paragraph [ref=f2e3598]: "Рекомендуемая схема:"
              - list [ref=f2e3599]:
                - listitem [ref=f2e3600]:
                  - paragraph [ref=f2e3601]: Server-side принимает webhook на callbackUrl и сразу отвечает HTTP 200.
                - listitem [ref=f2e3602]:
                  - paragraph [ref=f2e3603]: Server-side валидирует тело webhook и сохраняет актуальный статус по ключу id.
                - listitem [ref=f2e3604]:
                  - paragraph [ref=f2e3605]: "Server-side уведомляет клиентское приложение о смене статуса:"
                - list [ref=f2e3606]:
                  - listitem [ref=f2e3607]:
                    - paragraph [ref=f2e3608]: через Long polling (клиентский polling endpoint вашего сервера),
                  - listitem [ref=f2e3609]:
                    - paragraph [ref=f2e3610]: либо через WebSocket (server-side пушит событие в существующее соединение).
                - listitem [ref=f2e3611]:
                  - paragraph [ref=f2e3612]: "Клиентское приложение использует id, полученный из ответа send, чтобы отобразить корректный экран:"
                - list [ref=f2e3613]:
                  - listitem [ref=f2e3614]:
                    - paragraph [ref=f2e3615]: при status=3 отображается форма ввода OTP (SMS OTP),
                  - listitem [ref=f2e3616]:
                    - paragraph [ref=f2e3617]: при финальных status=1/2 завершается сценарий аутентификации.
              - paragraph [ref=f2e3618]: "Ниже пример последовательности для сценария, когда SIM-PUSH не сработал и выполняется переход на SMS OTP:"
              - generic [ref=f2e3619]:
                - code [ref=f2e3621]: "sequenceDiagram autonumber participant AB as \"Абонент\" participant CL as \"Клиент\" participant SV as \"Сервер\" participant API as \"SMS Aero API\" AB->>CL: Вводит номер телефона CL->>SV: Запрашивает аутентификацию по номеру SV->>API: POST /v2/mobile-id/send (number, sign, callbackUrl) API-->>SV: success + data.id alt SIM-PUSH доступен и подтверждён API-->>AB: Запрос подтверждения (SIM-PUSH) AB->>CL: Нажимает «Подтвердить» API-->>SV: POST callbackUrl (status=1 или status=2) SV-->>CL: Отобразить результат аутентификации else SIM-PUSH не сработал API-->>AB: Отправляет SMS OTP (одноразовый код) API-->>SV: POST callbackUrl (status=3, требуется SMS OTP) SV-->>CL: Показать форму ввода OTP AB->>CL: Вводит OTP-код CL->>SV: Передаёт введённый code SV->>API: POST /v2/mobile-id/verify (id, sign, code) API-->>SV: success API-->>SV: POST callbackUrl (final status=1 или status=2) SV-->>CL: Отобразить результат аутентификации end"
                - button [ref=f2e3622] [cursor=pointer]
