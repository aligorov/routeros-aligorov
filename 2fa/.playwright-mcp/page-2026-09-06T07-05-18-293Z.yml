          - generic [ref=f2e3363]:
            - text: Мобильная авторизация
            - button "Скопировать ссылку" [ref=f2e3365] [cursor=pointer]
            - generic [ref=f2e3367]:
              - paragraph [ref=f2e3368]: Аутентификация пользователя через проверку подлинности номера телефона.
              - paragraph [ref=f2e3369]: Проверка выполняется оператором через push-уведомление, которое отправляется на устройство пользователя через SIM-карту (SIM-PUSH). Если подтверждение по SIM-PUSH не удалось (недоступно или не было получено), выполняется попытка аутентификации с помощью одноразового кода (SMS OTP).
              - paragraph [ref=f2e3370]: "Процесс для абонента:"
              - list [ref=f2e3371]:
                - listitem [ref=f2e3372]: Абонент вводит номер телефона на сайте или в мобильном приложении.
                - listitem [ref=f2e3373]: Абонент получает либо запрос на подтверждение (SIM-PUSH), либо SMS с одноразовым кодом.
                - listitem [ref=f2e3374]: "Абонент подтверждает вход: нажатием «Подтвердить» (SIM-PUSH) или вводом OTP-кода в соответствующее поле (SMS OTP)."
              - heading "Тестирование" [level=3] [ref=f2e3375]
              - paragraph [ref=f2e3376]:
                - text: Методы мобильной авторизации поддерживают тестовый режим. Для тестирования не требуется оформлять имя отправителя. Используйте
                - link "тестовый API-ключ" [ref=f2e3377] [cursor=pointer]:
                  - /url: https://smsaero.ru/cabinet/settings/apikey/
                - text: ", полученный в разделе «Настройки → API и SMPP» личного кабинета, и значение"
                - code [ref=f2e3378]: SMS Aero
                - text: в параметре
                - code [ref=f2e3379]: sign
                - text: .
              - paragraph [ref=f2e3380]:
                - text: В тестовом режиме SMS не отправляются, списание средств не выполняется, код подтверждения всегда
                - code [ref=f2e3381]: "1234"
                - text: .
