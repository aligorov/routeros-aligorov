                        - paragraph [ref=f2e3546]: status
                      - columnheader [ref=f2e3547]:
                        - paragraph [ref=f2e3548]: Значение
                  - rowgroup [ref=f2e3549]:
                    - row [ref=f2e3550]:
                      - cell [ref=f2e3551]:
                        - paragraph [ref=f2e3552]: "0"
                      - cell [ref=f2e3553]:
                        - paragraph [ref=f2e3554]: Ожидает начала (очередь)
