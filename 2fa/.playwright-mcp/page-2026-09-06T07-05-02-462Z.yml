        - paragraph [ref=f1e1537]: "Особенности тарифного плана:"
        - list [ref=f1e1538]:
          - listitem [ref=f1e1539]: Тариф с гарантированной доставкой СМС, подключение требует модерации документа на подпись операторами связи (5-10 рабочих дней);
          - listitem [ref=f1e1540]: Тариф без абонентской платы за подпись;
          - listitem [ref=f1e1541]:
            - generic [ref=f1e1542]: Ваша подпись является отправителем СМС для всех операторов РФ, кроме МТС и Мегафон. При отправке СМС абонентам операторов МТС и Мегафон сервис будет вставлять вашу подпись в начало текста СМС, а само сообщение отправлять от нейтральной буквенной подписи, в зависимости от оператора, например BYTEHAND, BH SMS, MSG и иные
            - text: ;
          - listitem [ref=f1e1543]:
            - generic [ref=f1e1544]: Тарификация пакетами для ПАО "Вымпел-Коммуникации" подразумевает оплату пакета из 5 (пяти) частей СМС одному абоненту от одной подписи отправителя. Оплата списывается в момент отправки первой СМС данному абоненту в текущем месяце. Если отправляемая первая СМС состоит менее чем из 5 частей, остальные СМС можно отправить бесплатно до истечения календарного месяца. Если количество отправленных СМС превышает 5 (пять) за календарный месяц, списывается оплата за 2й и последующие пакеты СМС
            - text: .
