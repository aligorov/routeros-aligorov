        - heading "Тарифы" [level=1] [ref=f1e168]
        - heading "Отправка СМС по России" [level=2] [ref=f1e170]
        - paragraph [ref=f1e171]: С 2014 года операторы связи РФ не поддерживают гарантированную моментальную доставку СМС через интернет-сервисы для клиентов-физических лиц, работающих без договора с СМС-шлюзом.
        - paragraph [ref=f1e172]: BYTEHAND использует лучшие технологии для высокого уровня доставки СМС даже на тарифе по умолчанию, однако всё же рекомендует компаниям-клиентам выбирать один из ПРЯМЫХ тарифов, описанных ниже. Только на них операторами связи гарантируется 100% моментальная доставка.
