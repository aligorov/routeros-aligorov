          - listitem [ref=f1e2017]:
            - generic [ref=f1e2018]: Тарификация пакетами для ПАО "Вымпел-Коммуникации" подразумевает оплату пакета из 5 (пяти) частей СМС одному абоненту от одной подписи отправителя. Оплата списывается в момент отправки первой СМС данному абоненту в текущем месяце. Если отправляемая первая СМС состоит менее чем из 5 частей, остальные СМС можно отправить бесплатно до истечения календарного месяца. Если количество отправленных СМС превышает 5 (пять) за календарный месяц, списывается оплата за 2й и последующие пакеты СМС
