          - definition [ref=e246]: Описание публичных методов BYTEHAND API v2, их параметров и возвращаемых данных. Раздел рассчитан на разработчиков, знакомых с Web-программированием и объектно-ориентированной парадигмой разработки.
          - term [ref=e247]:
            - link "Список объектов" [ref=e248] [cursor=pointer]:
              - /url: /developers/v2/objects
          - definition [ref=e249]: В разделе описаны объекты BYTEHAND API v2 и даны ссылки на использующие их методы API.
