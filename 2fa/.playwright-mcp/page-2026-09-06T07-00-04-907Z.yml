                - cell "Дата и время последнего изменения статуса СМС сообщения." [ref=f2e265]
          - heading "Пример 1" [level=3] [ref=f2e267]
          - paragraph [ref=f2e268]: "В качестве адреса в Настройках указано:"
          - generic [ref=f2e269]: "http://www.somesite.com/bytehand_callback?secret=msp5Tca5vuHkSz7C&sms=${sms_id}&state=${state}"
          - paragraph [ref=f2e270]: "Ваш обработчик будет вызываться так:"
          - generic [ref=f2e271]: GET http://www.somesite.com/bytehand_callback?secret=msp5Tca5vuHkSz7C&sms=33328197206816238&state=DELIVERED
          - heading "Пример 2" [level=3] [ref=f2e273]
          - paragraph [ref=f2e274]: "В качестве адреса в Настройках указано:"
