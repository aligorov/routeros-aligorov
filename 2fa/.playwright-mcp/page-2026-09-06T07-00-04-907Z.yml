        - heading "Начало работы" [level=1] [ref=f2e174]
        - generic [ref=f2e175]:
          - generic [ref=f2e177]:
            - img [aria-hidden] [ref=f2e178]: info
            - paragraph [ref=f2e179]: Использование BYTEHAND API доступно для всех пользователей, для его активации не требуется совершать дополнительных действий.
          - heading "Запросы к API" [level=2] [ref=f2e181]
          - paragraph [ref=f2e182]: Взаимодействие с BYTEHAND API v1 происходит по протоколу HTTPS. Для подключения необходимо использовать базовый адрес https://api.bytehand.com/v1.
          - heading "Ограничения и рекомендации" [level=2] [ref=f2e184]
          - paragraph [ref=f2e185]: "При работе с BYTEHAND API следует обратить внимание, что:"
          - list [ref=f2e186]:
            - listitem [ref=f2e187]: Все параметры, которые содержат специальные символы (плюс, пробел и т.д.), должны быть закодированы при помощи функции urlEncode для передачи в HTTP-запросе.
            - listitem [ref=f2e188]: Значение заголовка Content-Type должно быть установлено какapplication/json;charset=UTF-8.
            - listitem [ref=f2e189]: Если запрос требует передать данные в теле запроса, то необходимо предоставить объект или список объектов в формате JSON, кодировка UTF-8.
            - listitem [ref=f2e190]: Если явно не указано другого, после обработки запроса BYTEHAND API возвращает ответ в формате JSON, кодировка UTF-8.
          - heading "Авторизация" [level=2] [ref=f2e192]
          - paragraph [ref=f2e193]: Для выполнения всех запросов BYTEHAND API v1 требуется авторизация пользователя, для этого в запросе передаются два параметра id и key.
          - table [ref=f2e194]:
            - rowgroup [ref=f2e195]:
              - row [ref=f2e196]:
                - columnheader "Параметры запроса" [ref=f2e197]
                - columnheader [ref=f2e198]
            - rowgroup [ref=f2e199]:
              - row [ref=f2e200]:
                - cell "id" [ref=f2e201]
                - cell [ref=f2e202]:
                  - paragraph [ref=f2e203]: number
                  - paragraph [ref=f2e204]: Обязательный параметр. Идентификатор пользователя.
              - row [ref=f2e205]:
                - cell "key" [ref=f2e206]
                - cell "string Обязательный параметр. Уникальный ключ пользователя. Cтрока из 16 символов, пример AB48D920104CE241." [ref=f2e207]:
                  - paragraph [ref=f2e208]: string
                  - paragraph [ref=f2e209]:
                    - generic [ref=f2e210]: Обязательный параметр. Уникальный ключ пользователя. Cтрока из 16 символов, пример AB48D920104CE241.
          - paragraph [ref=f2e211]:
            - text: Значения этих параметров можно получить в личном кабинете на странице
            - img [aria-hidden] [ref=f2e212]: settings
            - text: Настройки → вкладка Безопасность → раздел Управление ключами доступа, версия API v1.
          - generic [ref=f2e214]:
            - img [aria-hidden] [ref=f2e215]: verified_user
            - paragraph [ref=f2e216]: Сохраняйте значение ключа в тайне и не передавайте его другим лицам. Используйте кнопку Пересоздать ключ, если ключ был скомпрометирован и вам требуется изменить его значение.
          - heading "Извещения о статусе СМС сообщений" [level=2] [ref=f2e218]
          - paragraph [ref=f2e219]:
            - text: Если в личном кабинете на странице
            - img [aria-hidden] [ref=f2e220]: settings
            - text: Настройки → вкладка СМС → раздел Извещения о статусе СМС сообщений вы выбрали пункт Передавать через HTTP GET запрос по адресу, то информация об отправленных СМС сообщениях будет передаваться на указанный адрес.
          - paragraph [ref=f2e221]: "При создании своего обработчика передаваемой информации необходимо учитывать:"
          - list [ref=f2e222]:
            - listitem [ref=f2e223]: Все параметры передаются методом GET.
            - listitem [ref=f2e224]: В ответ на передачу статуса сообщений клиент должен вернуть HTTP код 200 (OK), это будет означать, что статус обработан без ошибки.
            - listitem [ref=f2e225]: Обработка запроса должны завершиться в течение 10 секунд, иначе BYTEHAND будет считать, что обработка закончилась с ошибкой.
            - listitem [ref=f2e226]: Статусы сообщений, которые были обработаны с ошибкой или не были обработаны, будут переданы повторно.
            - listitem [ref=f2e227]: Статусы, не обработанные в течение 48 часов с момента отправки сообщения, далее не передаются клиенту.
          - generic [ref=f2e229]:
            - img [aria-hidden] [ref=f2e230]: privacy_tip
            - paragraph [ref=f2e231]: Для защиты данных от подмены проверяйте аутентичность передаваемой информации с помощью секретного параметра или проверяйте значение параметра key (api_key_v1).
          - paragraph [ref=f2e232]: "В параметрах запроса, в фигурных скобках, можно указать, какие поля данных вы хотите получать. Если поля данных не указаны, то передаются поля: id, key, action, message, description, parts, cost, error_code, updated_at."
          - table [ref=f2e233]:
            - rowgroup [ref=f2e234]:
              - row [ref=f2e235]:
                - columnheader "Поле данных" [ref=f2e236]
                - columnheader "Описание" [ref=f2e237]
            - rowgroup [ref=f2e238]:
