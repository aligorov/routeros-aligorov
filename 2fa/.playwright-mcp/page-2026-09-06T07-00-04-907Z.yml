                - cell "Идентификатор пользователя." [ref=f2e241]
              - row [ref=f2e242]:
                - cell "key, api_key_v1" [ref=f2e243]
                - cell "Последние 8 символов уникального ключа пользователя." [ref=f2e244]
              - row [ref=f2e245]:
                - cell "action" [ref=f2e246]
                - cell "Операция, для статуса СМС сообщения это значение outgoingStatus." [ref=f2e247]
              - row [ref=f2e248]:
                - cell "message, sms_id" [ref=f2e249]
                - cell "Идентификатор СМС сообщения." [ref=f2e250]
              - row [ref=f2e251]:
