          - heading "Получение даты и времени" [level=2] [ref=f2e279]
          - paragraph [ref=f2e280]: "Все методы BYTEHAND API возвращают дату и время в часовом поясе, заданном в настройках пользователя, в формате yyyy-MM-dd'T'HH:mm:ss.SSSZ, пример: 2017-04-25T00:41:27.000+0300."
          - heading "Передача даты и времени" [level=2] [ref=f2e282]
          - paragraph [ref=f2e283]: "Все методы BYTEHAND API получают дату и время по умолчанию в часовом поясе, заданном в настройках пользователя, рекомендуемый формат yyyy-MM-dd'T'HH:mm:ss.SSSZ, пример: 2017-04-25T00:41:27.000+0300."
          - heading "Дополнительные форматы" [level=3] [ref=f2e285]
          - paragraph [ref=f2e286]: Кроме рекомендуемого формата возможно использовать любой из дополнительных форматов.
          - table [ref=f2e287]:
            - rowgroup [ref=f2e288]:
