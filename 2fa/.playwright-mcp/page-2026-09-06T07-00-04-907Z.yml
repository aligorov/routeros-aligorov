                - 'cell "Статус сообщения. Возможные значения: NEW, PAUSED, DELIVERED, EXPIRED, DELETED, UNDELIVERABLE, ACCEPTED, UNKNOWN, REJECTED." [ref=f2e253]'
              - row [ref=f2e254]:
                - cell "parts" [ref=f2e255]
                - cell "На сколько частей было разбито исходное сообщение." [ref=f2e256]
              - row [ref=f2e257]:
                - cell "cost, price" [ref=f2e258]
                - cell "Стоимость СМС сообщения." [ref=f2e259]
