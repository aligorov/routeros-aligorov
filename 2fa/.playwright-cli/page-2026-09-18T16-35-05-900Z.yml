      - generic [ref=e42]:
        - heading "📬 Шлюз уведомлений" [level=1] [ref=e43]
        - paragraph [ref=e44]: Доставка сообщений внешних систем пользователю — по его верифицированным каналам 2FA. Мониторинг, CRM или HR-бот отправляет сообщение одним API-запросом — Ligament доставляет его на почту, в мессенджер и на телефон сотрудника.
      - generic [ref=e45]:
        - heading "📖 Как это работает" [level=2] [ref=e47]
        - list [ref=e48]:
          - listitem [ref=e49]:
            - strong [ref=e50]: Внешняя система
            - text: вызывает
            - code [ref=e51]: POST /api/v1/notify
            - text: со своим API-токеном (scope
            - code [ref=e52]: notify
            - text: ), передавая получателя, тему и текст.
          - listitem [ref=e53]:
            - strong [ref=e54]: Ligament определяет каналы
            - text: пользователя — только те, что привязаны и подтверждены в 2FA. Пустой список каналов = все привязанные (кроме платной SMS).
          - listitem [ref=e55]:
            - strong [ref=e56]: Очередь доставляет
            - text: сообщение в каждый канал; при сбое канала — повторы через 1с / 4с / 16с, затем фиксируется финальный статус.
          - listitem [ref=e57]:
            - strong [ref=e58]: Журнал ниже
            - text: показывает результат по каждому каналу; внешняя система может получить его callback'ом с HMAC-подписью.
