# =============================================================
#  СГЕНЕРИРОВАН scripts/build.sh — НЕ РЕДАКТИРОВАТЬ ВРУЧНУЮ
#  Источники приложений: apps/*/app.yaml
# =============================================================
- name: A-amneziawg-mikrotik
  descr: AmneziaWG 3.1 (v1.6.2) — Dual-Stack (IPv4+IPv6), Multi-Tunnel, Auto-Rotation
    (Token/API :8443), Failover (TCP + ICMP Ping), DoH, Telegram, GeoSite/GeoIP, RouterOS
    (Address-List/BGP/Binary API), Терминал
  page: https://github.com/aligorov/routeros-aligorov/tree/main/apps/a-amneziawg-mikrotik
  category: networking
  icon: https://aligorov.github.io/routeros-aligorov/apps/a-amneziawg-mikrotik/icon.png
  auto-update: false
  services:
    a-amneziawg-mikrotik:
      image: ghcr.io/aligorov/routeros-aligorov/amneziawg-mikrotik:1
      hostname: amneziawg
      ports:
      - 8092:8080/tcp:web
      - 51821:51820/udp
      environment:
        LOG_LEVEL: error
        WG_QUICK_USERSPACE_IMPLEMENTATION: amneziawg-go
        AWG_AUTO_ROUTE: 'on'
        AWG_KILLSWITCH: 'on'
        DNS_ENABLE: 'on'
        DNS_UPSTREAM: 1.1.1.1:53,8.8.8.8:53
        UI_USER: admin
        AWG_HEALTH_MAX_HANDSHAKE_SEC: '0'
        TZ: UTC
      volumes:
      - awg-config:/etc/amnezia/amneziawg
      restart: unless-stopped
  volumes:
    awg-config: {}
- name: A-ligament-ice
  descr: Ligament ICE (coturn + certbot) — WebRTC STUN/TURN/TURNS TLS (443, 3478,
    5349) для Ligament 2FA
  page: https://github.com/aligorov/ligament-ice
  category: networking
  icon: https://aligorov.github.io/routeros-aligorov/apps/ligament-ice/icon.png
  default-credentials: ligament:change-me
  auto-update: false
  services:
    certbot:
      image: ghcr.io/aligorov/routeros-aligorov/ligament-ice-certbot:1
      hostname: ligament-ice-certbot
      ports:
      - 80:80/tcp
      environment:
        REALM: turn.example.com
        ACME_EMAIL: admin@example.com
        TZ: UTC
      volumes:
      - certs:/etc/letsencrypt
      restart: unless-stopped
    ice:
      image: ghcr.io/aligorov/routeros-aligorov/ligament-ice:1
      hostname: ligament-ice
      depends_on:
      - certbot
      ports:
      - 443:443/tcp
      - 443:443/udp
      - 3478:3478/tcp
      - 3478:3478/udp
      - 5349:5349/tcp
      - 5349:5349/udp
      environment:
        REALM: turn.example.com
        EXTERNAL_IP: auto
        TURN_USER: ligament
        TURN_PASSWORD: change-me
        TURN_MIN_PORT: '49152'
        TURN_MAX_PORT: '49250'
        TZ: UTC
      volumes:
      - certs:/etc/coturn/certs
      - ice-config:/etc/coturn
      restart: unless-stopped
  volumes:
    certs: {}
    ice-config: {}
- name: A-ligament-relay
  descr: Ligament Relay — периферийный edge-узел филиала Ligament 2FA (RADIUS 1812,
    HTTP/WS 8082, LDAP/LDAPS, offline TOTP)
  page: https://github.com/aligorov/ligament-relay
  category: security
  icon: https://aligorov.github.io/routeros-aligorov/apps/ligament-relay/icon.png
  auto-update: false
  services:
    ligament-relay:
      image: ghcr.io/aligorov/routeros-aligorov/ligament-relay:1
      hostname: ligament-relay
      ports:
      - 1812:1812/udp
      - 8082:8082/tcp
      environment:
        CONFIG_MODE: env
        RELAY_ID: branch-routeros
        RELAY_NAME: RouterOS Branch
        RELAY_HOST_IP: auto
        RELAY_MAX_OFFLINE_TTL: 72h
        CORE_URL: https://2fa.example.com
        RELAY_CORE_PASSWORD: change-me-core-password
        CORE_INSECURE_SKIP_VERIFY: 'false'
        CORE_ALLOW_INSECURE: 'false'
        RADIUS_ENABLED: 'true'
        RELAY_RADIUS_SECRET: change-me-radius-secret
        RADIUS_TRUST_DAYS: '7'
        RADIUS_REQUIRE_MSG_AUTH: 'true'
        RADIUS_VERIFY_NAS_IP: 'false'
        LDAP_ENABLED: 'true'
        LDAP_URL: ldaps://dc01.example.local:636
        LDAP_BASE_DN: DC=example,DC=local
        LDAP_BIND_DN: CN=svc_2fa,OU=Service Accounts,DC=example,DC=local
        RELAY_LDAP_PASSWORD: change-me-ldap-password
        LDAP_USER_FILTER: (sAMAccountName=%s)
        LDAP_INSECURE_SKIP_VERIFY: 'false'
        RELAY_API_TOKEN: auto
        DISCOVERY_ENABLED: 'true'
        DISCOVERY_PORT: '8082'
        BASTION_ALLOW_CIDRS: 192.168.0.0/16,10.0.0.0/8
        TZ: UTC
      volumes:
      - relay-config:/app/config
      - relay-data:/app/data
      - relay-keys:/app/keys
      - relay-certs:/app/certs
      restart: unless-stopped
  volumes:
    relay-config: {}
    relay-data: {}
    relay-keys: {}
    relay-certs: {}
- name: A-mikrotik-mcp
  descr: MCP-шлюз (v1.1.0) для RouterOS 7.24+ (REST API + Binary API over Streamable
    HTTP) — 35 инструментов управления, диагностики, анализа логов и скриптов
  page: https://github.com/aligorov/routeros-aligorov/tree/main/apps/mikrotik-mcp
  category: ai
  icon: https://aligorov.github.io/routeros-aligorov/apps/mikrotik-mcp/icon.png
  url-path: /healthz
  auto-update: false
  services:
    mikrotik-mcp:
      image: ghcr.io/aligorov/routeros-aligorov/mikrotik-mcp-server:1.1.0
      hostname: mikrotik-mcp
      ports:
      - 3000:3000/tcp:web
      environment:
        MCP_TRANSPORT: http
        MCP_HOST: 0.0.0.0
        MCP_PORT: '3000'
        MCP_PATH: /mcp
        MCP_BEARER_TOKEN: auto
        MIKROTIK_HOST: auto
        MIKROTIK_ROUTER_ID: local-router
        MIKROTIK_USERNAME: mcp
        MIKROTIK_PASSWORD: change-me-router-password
        MIKROTIK_TRANSPORT_PREF: auto
        MIKROTIK_REST_PROTOCOL: https
        MIKROTIK_REST_PORT: '443'
        MIKROTIK_API_TLS: 'true'
        MIKROTIK_API_PORT: '8729'
        MIKROTIK_TLS_VERIFY: 'false'
        MIKROTIK_TIMEOUT_MS: '30000'
        MCP_AUDIT_LOG_PATH: /app/data/mcp-audit.jsonl
        MIKROTIK_ROUTER_AUDIT_LOG: 'true'
        MIKROTIK_ROUTER_LOG_MARKERS: 'true'
        TZ: UTC
      volumes:
      - mcp-config:/app/config
      - mcp-data:/app/data
      restart: unless-stopped
  volumes:
    mcp-config: {}
    mcp-data: {}
- name: A-openchat-node-server
  descr: OpenChat Sovereign Mesh Node — STUN Rendezvous, Blind Mailbox, No-Exit Relay,
    MediaRelay (UDP :4433) & ShadowTLS v3 (TCP :8443)
  page: https://github.com/aligorov/routeros-aligorov/tree/main/apps/openchat-node-server
  category: messaging
  icon: https://aligorov.github.io/routeros-aligorov/apps/openchat-node-server/icon.png
  auto-update: false
  services:
    openchat-node-server:
      image: ghcr.io/aligorov/routeros-aligorov/openchat-node-server:1
      hostname: openchat-node-server
      ports:
      - 4433:4433/udp
      - 8443:8443/tcp
      environment:
        OPENCHAT_PORT: '4433'
        OPENCHAT_TLS_PORT: '8443'
        OPENCHAT_SNI_DONOR: yastatic.net
        OPENCHAT_STRICT_NOISE: 'true'
        OPENCHAT_PIN: auto
        OPENCHAT_ENABLE_TG: 'false'
        OPENCHAT_SPONSOR: '@openchat_freedom'
        OPENCHAT_PUSH_GATEWAY_URL: none
        TZ: UTC
      volumes:
      - openchat-data:/var/lib/openchat
      restart: unless-stopped
  volumes:
    openchat-data: {}
- name: A-openchat-push-gateway
  descr: OpenChat Blind Push Gateway — слепые PushCapability (XChaCha20-Poly1305)
    и APNs/FCM пробуждение без раскрытия контактов
  page: https://github.com/aligorov/routeros-aligorov/tree/main/apps/openchat-push-gateway
  category: messaging
  icon: https://aligorov.github.io/routeros-aligorov/apps/openchat-push-gateway/icon.png
  url-path: /health
  auto-update: false
  services:
    openchat-push-gateway:
      image: ghcr.io/aligorov/routeros-aligorov/openchat-push-gateway:1
      hostname: openchat-push-gateway
      ports:
      - 8088:8088/tcp:web
      environment:
        PUSH_GATEWAY_PORT: '8088'
        PUSH_CAP_KEY: auto
        APNS_KEY_PATH: auto
        APNS_KEY_ID: none
        APNS_TEAM_ID: none
        APNS_BUNDLE_ID: org.openchat.ios
        APNS_SANDBOX: 'false'
        FCM_KEY_PATH: auto
        TZ: UTC
      volumes:
      - push-data:/var/lib/openchat-push
      - push-keys:/app/keys
      restart: unless-stopped
  volumes:
    push-data: {}
    push-keys: {}
