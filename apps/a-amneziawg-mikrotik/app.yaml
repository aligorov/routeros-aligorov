name: A-amneziawg-mikrotik
descr: "AmneziaWG 3.1 (v1.6.0) — Multi-Tunnel, Auto-Rotation (Token/API :8443), Failover (TCP + ICMP Ping), DoH, Telegram, GeoSite/GeoIP, RouterOS (Address-List/BGP/Binary API), Терминал"
page: https://github.com/aligorov/routeros-aligorov/tree/main/apps/a-amneziawg-mikrotik
category: networking
icon: icon.png
auto-update: false

services:
  a-amneziawg-mikrotik:
    image: ghcr.io/aligorov/routeros-aligorov/amneziawg-mikrotik:1
    hostname: amneziawg
    ports:
      - 8092:8080/tcp:web
      - 51821:51820/udp
    environment:
      LOG_LEVEL: error
      WG_QUICK_USERSPACE_IMPLEMENTATION: amneziawg-go
      AWG_AUTO_ROUTE: "on"
      AWG_KILLSWITCH: "on"
      DNS_ENABLE: "on"
      DNS_UPSTREAM: "1.1.1.1:53,8.8.8.8:53"
      UI_USER: admin
      AWG_HEALTH_MAX_HANDSHAKE_SEC: "0"
      TZ: UTC
    volumes:
      - awg-config:/etc/amnezia/amneziawg
    restart: unless-stopped

volumes:
  awg-config: {}
