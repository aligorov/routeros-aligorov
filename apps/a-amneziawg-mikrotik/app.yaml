name: A-amneziawg-mikrotik
descr: "AmneziaWG 3.1 (amneziawg-go + awg-quick) клиент и сервер для RouterOS — без OpenRC, авто-маршрутизация и конфиг через AWG_CONF_B64 или том"
page: https://github.com/aligorov/routeros-aligorov/tree/main/apps/a-amneziawg-mikrotik
category: networking
icon: icon.png
auto-update: false

networks:
  amneziawg:
    name: AmneziaWGRoS
    external: true

services:
  a-amneziawg-mikrotik:
    image: ghcr.io/aligorov/routeros-aligorov/amneziawg-mikrotik:1.0.0
    hostname: amneziawg
    ports:
      - 51821:51820/udp
    environment:
      LOG_LEVEL: error
      WG_QUICK_USERSPACE_IMPLEMENTATION: amneziawg-go
      AWG_AUTO_ROUTE: "on"
      AWG_KILLSWITCH: "on"
      AWG_CONF_B64: ""
      TZ: UTC
    volumes:
      - awg-config:/etc/amnezia/amneziawg
    restart: unless-stopped

volumes:
  awg-config: {}
