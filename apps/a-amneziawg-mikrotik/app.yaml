name: A-amneziawg-mikrotik
descr: "[v1.1.0] AmneziaWG 3.1 для RouterOS с WebUI, QR-генератором, DNS-форвардером, Netwatch и REST-синком маршрутов"
page: https://github.com/aligorov/routeros-aligorov/tree/main/apps/a-amneziawg-mikrotik
category: networking
icon: icon.png
auto-update: false

networks:
  amneziawg:
    name: AmneziaWGRoS
    external: true

services:
  a-amneziawg-mikrotik:
    image: ghcr.io/aligorov/routeros-aligorov/amneziawg-mikrotik:1.1.0
    hostname: amneziawg
    ports:
      - 8092:8080/tcp:web
      - 51821:51820/udp
    environment:
      LOG_LEVEL: error
      WG_QUICK_USERSPACE_IMPLEMENTATION: amneziawg-go
      AWG_AUTO_ROUTE: "on"
      AWG_KILLSWITCH: "on"
      AWG_CONF_B64: ""
      DNS_ENABLE: "on"
      DNS_UPSTREAM: "1.1.1.1:53,8.8.8.8:53"
      UI_USER: admin
      UI_PASSWORD: ""
      ROS_URL: ""
      ROS_USER: ""
      ROS_PASS: ""
      AWG_HEALTH_MAX_HANDSHAKE_SEC: "0"
      TZ: UTC
    volumes:
      - awg-config:/etc/amnezia/amneziawg
    restart: unless-stopped

volumes:
  awg-config: {}
