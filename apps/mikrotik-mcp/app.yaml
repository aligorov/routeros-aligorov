name: A-mikrotik-mcp
descr: "MCP-шлюз нового поколения (v2.0.3) для RouterOS 7.24+ (REST API + Binary API over Streamable HTTP) — 46 инструментов, аудит безопасности (0-100), автодискавери, машина времени снапшотов конфигурации, diffing парка, веб-дашборд (/dashboard) с SVG-топологией и проактивный инцидент-мониторинг"
page: https://github.com/aligorov/routeros-aligorov/tree/main/apps/mikrotik-mcp
category: ai
icon: icon.png
url-path: /dashboard
auto-update: false

services:
  mikrotik-mcp:
    image: ghcr.io/aligorov/routeros-aligorov/mikrotik-mcp-server:2.0.3
    hostname: mikrotik-mcp
    ports:
      - 3000:3000/tcp:web
    environment:
      MCP_TRANSPORT: http
      MCP_HOST: 0.0.0.0
      MCP_PORT: "3000"
      MCP_PATH: /mcp
      MCP_ALLOWED_HOSTS: "*"
      MCP_BEARER_TOKEN: auto
      MCP_READONLY_TOKENS: ""
      MCP_DENY_POWER_ACTIONS: "false"
      MCP_WATCH_ENABLED: "true"
      MCP_WATCH_INTERVAL_SEC: "60"
      MCP_DASHBOARD_ENABLED: "true"
      MCP_DASHBOARD_ALLOWED_IPS: ""
      MIKROTIK_HOST: auto
      MIKROTIK_ROUTER_ID: local-router
      MIKROTIK_USERNAME: mcp
      MIKROTIK_PASSWORD: change-me-router-password
      MIKROTIK_TRANSPORT_PREF: auto
      MIKROTIK_REST_PROTOCOL: https
      MIKROTIK_REST_PORT: "443"
      MIKROTIK_API_TLS: "true"
      MIKROTIK_API_PORT: "8729"
      MIKROTIK_TLS_VERIFY: "false"
      MIKROTIK_TIMEOUT_MS: "30000"
      MCP_AUDIT_LOG_PATH: /app/data/mcp-audit.jsonl
      MCP_SNAPSHOT_DIR: /app/data/snapshots
      MIKROTIK_ROUTER_AUDIT_LOG: "true"
      MIKROTIK_ROUTER_LOG_MARKERS: "true"
      TZ: UTC
    volumes:
      - mcp-config:/app/config
      - mcp-data:/app/data
    restart: unless-stopped

volumes:
  mcp-config: {}
  mcp-data: {}
