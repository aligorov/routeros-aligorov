name: A-mikrotik-mcp
descr: "MCP-шлюз (v1.3.0) для RouterOS 7.24+ (REST API + Binary API over Streamable HTTP) — 38 инструментов управления, параллельной настройки парка, диагностики, анализа логов и скриптов"
page: https://github.com/aligorov/routeros-aligorov/tree/main/apps/mikrotik-mcp
category: ai
icon: icon.png
url-path: /healthz
auto-update: false

services:
  mikrotik-mcp:
    image: ghcr.io/aligorov/routeros-aligorov/mikrotik-mcp-server:1.3.0
    hostname: mikrotik-mcp
    ports:
      - 3000:3000/tcp:web
    environment:
      MCP_TRANSPORT: http
      MCP_HOST: 0.0.0.0
      MCP_PORT: "3000"
      MCP_PATH: /mcp
      MCP_ALLOWED_HOSTS: "*"
      MCP_BEARER_TOKEN: auto
      MIKROTIK_HOST: auto
      MIKROTIK_ROUTER_ID: local-router
      MIKROTIK_USERNAME: mcp
      MIKROTIK_PASSWORD: change-me-router-password
      MIKROTIK_TRANSPORT_PREF: auto
      MIKROTIK_REST_PROTOCOL: https
      MIKROTIK_REST_PORT: "443"
      MIKROTIK_API_TLS: "true"
      MIKROTIK_API_PORT: "8729"
      MIKROTIK_TLS_VERIFY: "false"
      MIKROTIK_TIMEOUT_MS: "30000"
      MCP_AUDIT_LOG_PATH: /app/data/mcp-audit.jsonl
      MIKROTIK_ROUTER_AUDIT_LOG: "true"
      MIKROTIK_ROUTER_LOG_MARKERS: "true"
      TZ: UTC
    volumes:
      - mcp-config:/app/config
      - mcp-data:/app/data
    restart: unless-stopped

volumes:
  mcp-config: {}
  mcp-data: {}
