name: A-awg-proxy
descr: "awg-proxy (C11) — AmneziaWG 1.0–3.1 UDP-прокси для штатного WireGuard RouterOS (клиент/сервер/WARP)"
page: https://github.com/timbrs/amneziawg-mikrotik-c
category: networking
icon: icon.png
auto-update: false

services:
  a-awg-proxy:
    image: ghcr.io/timbrs/awg-proxy:latest
    hostname: awg-proxy
    shm_size: 4M
    ports:
      - 51820:51820/udp
    environment:
      AWG_MODE: normal
      AWG_LISTEN: ":51820"
      AWG_REMOTE: "engage.cloudflareclient.com:2408,500,1701,4500"
      AWG_SERVER_PUB: "bmXOC+F1FxEMF9dyiK2H5/1SUtzH0JuVo51h2wPfgyo="
      AWG_CLIENT_PUB: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      AWG_JC: "4"
      AWG_JMIN: "40"
      AWG_JMAX: "70"
      AWG_S1: "0"
      AWG_S2: "0"
      AWG_S3: "0"
      AWG_S4: "0"
      AWG_H1: "1"
      AWG_H2: "2"
      AWG_H3: "3"
      AWG_H4: "4"
      AWG_RANDOM_TRAILERS: "off"
      AWG_DISABLE_COOKIES: "off"
      AWG_SRC_PORT: random
      AWG_TIMEOUT: "60"
      AWG_DNS_REFRESH: "60"
      AWG_PORT_ROTATE: 30m-2h
      AWG_PORT_ROTATE_SOFT: auto
      AWG_HE_DELAY: "250"
      AWG_STATE_FILE: /etc/awg-proxy/awg-proxy.state
      AWG_LOG_LEVEL: info
      AWG_NO_GRO: "0"
      AWG_NO_GSO: "0"
      AWG_NO_DF: "0"
      AWG_AUTO_CPU: "on"
      AWG_STATS: "0"
    volumes:
      - awg-state:/etc/awg-proxy
    restart: unless-stopped

volumes:
  awg-state: {}
