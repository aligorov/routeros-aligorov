# =============================================================
#  СГЕНЕРИРОВАН (scripts/build.sh | service) — НЕ РЕДАКТИРОВАТЬ
#  Источники приложений: apps/*/app.yaml
# =============================================================
- name: combine-selftest
  descr: library/redis из Docker Hub (авто-конвертация store-combine)
  category: database
  icon: https://aligorov.github.io/routeros-aligorov/apps/combine-selftest/icon.png
  auto-update: false
  services:
    combine-selftest:
      image: docker.io/library/redis:7-alpine
      ports:
        - 6390:6379/tcp
      environment:
        REDIS_VERSION: 7.4.11
      restart: unless-stopped
- name: demo-nginx
  descr: "Демо: nginx — проверка работоспособности app-store end-to-end"
  page: https://nginx.org/
  category: development
  icon: https://aligorov.github.io/routeros-aligorov/apps/demo-nginx/icon.png
  auto-update: false
  services:
    demo-nginx:
      image: docker.io/library/nginx:1.27-alpine
      ports:
        - 8080:80/tcp:web
      restart: unless-stopped
- name: vpn-manager
  descr: "VPN user manager for MikroTik: WireGuard/OpenVPN/VLESS provisioning, AD sync, FreeRADIUS, self-service portal"
  page: https://github.com/aligorov/routeros-aligorov/tree/main/apps/vpn-manager
  category: security
  icon: https://aligorov.github.io/routeros-aligorov/apps/vpn-manager/icon.png
  default-credentials: admin:change-me
  auto-update: false
  services:
    db:
      image: docker.io/library/postgres:15-alpine
      environment:
        POSTGRES_USER: vpn_user
        POSTGRES_PASSWORD: change-me
        POSTGRES_DB: vpn_creator
      volumes:
        - pgdata:/var/lib/postgresql/data
      restart: unless-stopped
    app:
      image: ghcr.io/aligorov/routeros-aligorov/vpn-app:1.0.0
      ports:
        - 3000:3000/tcp:web
      environment:
        DATABASE_URL: postgresql://vpn_user:__POSTGRES_PASSWORD__@localhost:5432/vpn_creator
        POSTGRES_PASSWORD: change-me
        ENCRYPTION_KEY: auto
        SESSION_SECRET: auto
        ADMIN_DEFAULT_USERNAME: admin
        ADMIN_DEFAULT_PASSWORD: change-me
      volumes:
        - radius-cfg:/app/freeradius
        - app-data:/app/data
        - downloads:/app/public/portal/downloads
      restart: unless-stopped
    freeradius:
      image: ghcr.io/aligorov/routeros-aligorov/vpn-freeradius:1.0.0
      ports:
        - 1812:1812/udp:radius-auth
        - 1813:1813/udp:radius-acct
      volumes:
        - radius-cfg:/radius-cfg:ro
      restart: unless-stopped
  volumes:
    pgdata: {}
    radius-cfg: {}
    app-data: {}
    downloads: {}
